name: Angechat + — APK Android

on:
  push:
    branches: [unichat-plus]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unichat-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix || true

      - name: Version web (site à mettre en ligne)
        continue-on-error: true
        run: |
          npx expo export --platform web --output-dir web-dist
          cp assets/icon.png web-dist/icon.png || true
          printf '/*    /index.html   200\n' > web-dist/_redirects
          cd web-dist && zip -qr ../unichat-plus-web.zip . && cd .. && ls -la unichat-plus-web.zip

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        run: |
          bash scripts/set-abi.sh arm64-v8a armeabi-v7a
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk unichat-plus.apk

      - name: Compiler la version légère (téléphones récents, 64 bits)
        run: |
          bash scripts/set-abi.sh arm64-v8a
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Renommer la version légère
        run: cp android/app/build/outputs/apk/release/app-release.apk unichat-plus-leger.apk && ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: unichat-plus-apk
          path: |
            *.apk
            unichat-plus-web.zip
          if-no-files-found: warn

      - name: Publier l'APK (lien de téléchargement)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete unichat-apk --yes --cleanup-tag || true
          gh release create unichat-apk unichat-plus.apk unichat-plus-leger.apk $(ls unichat-plus-web.zip 2>/dev/null) \
            --target "${GITHUB_SHA}" \
            --title "Angechat + — APK Android (version ${{ github.run_number }})" \
            --notes "Application Android Angechat +, générée automatiquement. Téléchargez unichat-plus.apk puis ouvrez-le sur votre téléphone (autorisez l'installation d'applications inconnues)." \
            --prerelease
