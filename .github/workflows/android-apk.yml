name: Unichat + — APK Android

on:
  push:
    branches: [unichat-plus]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unichat-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix || true

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        working-directory: android
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' gradle.properties
          grep reactNativeArchitectures gradle.properties
          ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk unichat-plus.apk

      - name: Compiler la version légère (téléphones récents, 64 bits)
        working-directory: android
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
          grep reactNativeArchitectures gradle.properties
          ./gradlew assembleRelease --no-daemon

      - name: Renommer la version légère
        run: cp android/app/build/outputs/apk/release/app-release.apk unichat-plus-leger.apk && ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: unichat-plus-apk
          path: '*.apk'

      - name: Publier l'APK (lien de téléchargement)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete unichat-apk --yes --cleanup-tag || true
          gh release create unichat-apk unichat-plus.apk unichat-plus-leger.apk \
            --target "${GITHUB_SHA}" \
            --title "Unichat + — APK Android (version ${{ github.run_number }})" \
            --notes "Application Android Unichat +, générée automatiquement. Téléchargez unichat-plus.apk puis ouvrez-le sur votre téléphone (autorisez l'installation d'applications inconnues)." \
            --prerelease
